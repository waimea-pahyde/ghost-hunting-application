services:
  web:
    build: .
    ports:
      - "4999:4999"
    volumes:
      - .:/app        # live-reloads code changes without rebuilding
      - type: bind
        source: /etc/timezone
        target: /etc/timezone
        read_only: true
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
